name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to release"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib,sys; sys.stdout.write(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_REF="${{ inputs.ref || github.ref_name }}"
          # Strip leading "refs/tags/" if present
          TAG_NAME="${TAG_REF#refs/tags/}"
          EXPECTED="v${PKG_VERSION}"
          echo "package version: $PKG_VERSION"
          echo "tag:             $TAG_NAME"
          if [ "$TAG_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG_NAME' does not match pyproject version '$EXPECTED'"
            exit 1
          fi
      - name: Build
        run: python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smartsheet-mcp/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing via OIDC
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # No password/token needed: Trusted Publishing via OIDC.
          # Configure at https://pypi.org/manage/account/publishing/ once.

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          name: ${{ inputs.ref || github.ref_name }}
          body: |
            Release of smartsheet-mcp.

            Install from PyPI:
            ```
            pip install smartsheet-mcp==${{ inputs.ref || github.ref_name }}
            ```
            (strip the leading `v` from the tag if needed)

            See [CHANGELOG.md](https://github.com/Kcrong/smartsheet-mcp/blob/main/CHANGELOG.md) for full details.
          files: dist/*
          generate_release_notes: true
