name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.5.0"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (check only)
        run: ruff format --check .

  test:
    name: Smoke (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Import + tool-catalog integrity
        run: |
          python -c "from smartsheet_mcp.tools import TOOLS, HANDLERS; assert set(t.name for t in TOOLS) == set(HANDLERS); print(f'{len(TOOLS)} tools OK')"
      - name: CLI smoke
        run: |
          smartsheet-mcp --version
          smartsheet-mcp --help
      - name: MCP stdio handshake (no token required)
        # Feed a minimal initialize + tools/list and verify the server responds.
        shell: bash
        env:
          SMARTSHEET_ACCESS_TOKEN: dummy-token-for-ci
          SMARTSHEET_LOG_LEVEL: WARNING
        run: |
          python - <<'PY'
          import asyncio, json, sys, subprocess, os, signal, time
          proc = subprocess.Popen(
              ["smartsheet-mcp"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              env={**os.environ},
              text=True,
          )
          msgs = [
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}},
              {"jsonrpc":"2.0","method":"notifications/initialized"},
              {"jsonrpc":"2.0","id":2,"method":"tools/list"},
          ]
          proc.stdin.write("\n".join(json.dumps(m) for m in msgs) + "\n")
          proc.stdin.flush()
          # Read until we see both responses.
          seen = {}
          start = time.time()
          while time.time() - start < 15:
              line = proc.stdout.readline()
              if not line:
                  break
              line = line.strip()
              if not line.startswith("{"):
                  continue
              m = json.loads(line)
              if m.get("id") in (1, 2):
                  seen[m["id"]] = m
              if 1 in seen and 2 in seen:
                  break
          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()
          assert 1 in seen, f"no initialize response, stderr={proc.stderr.read()}"
          assert 2 in seen, "no tools/list response"
          tools = seen[2]["result"]["tools"]
          assert len(tools) >= 66, f"too few tools: {len(tools)}"
          print(f"handshake OK, tools={len(tools)}")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Install wheel in clean venv and run CLI
        shell: bash
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/smartsheet-mcp --version
          /tmp/verify/bin/python -c "from smartsheet_mcp.tools import TOOLS; assert len(TOOLS) >= 66"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
