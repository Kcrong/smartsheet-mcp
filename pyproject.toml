[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "smartsheet-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server exposing Smartsheet read APIs as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "smartsheet-mcp contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "smartsheet",
    "kiro",
    "claude",
    "llm",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
build = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
smartsheet-mcp = "smartsheet_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Kcrong/smartsheet-mcp"
Repository = "https://github.com/Kcrong/smartsheet-mcp"
Issues = "https://github.com/Kcrong/smartsheet-mcp/issues"
Changelog = "https://github.com/Kcrong/smartsheet-mcp/blob/main/CHANGELOG.md"

# -----------------------------------------------------------------------------
# Build backend: hatchling
# -----------------------------------------------------------------------------
[tool.hatch.build]
# Include LICENSE/README/CHANGELOG in the sdist automatically via hatch defaults,
# but be explicit to avoid surprises.
include = [
    "src/smartsheet_mcp/**/*.py",
    "src/smartsheet_mcp/py.typed",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartsheet_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/smartsheet_mcp",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
    ".env.example",
]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
    ".kiro",
    ".playwright-mcp",
    ".venv",
    ".github",
    "tests",
]

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "dist",
    "build",
    ".kiro",
    ".playwright-mcp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
